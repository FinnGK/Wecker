<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>Finns Wecker</title>
  <style>
:root {
  --bg: #0b1020;
  --bg2: #111827;
  --panel: rgba(15, 23, 42, 0.92);
  --panel-solid: #111827;
  --text: #f8fafc;
  --muted: #94a3b8;
  --line: rgba(148, 163, 184, 0.22);
  --accent: #38bdf8;
  --accent2: #818cf8;
  --accent-dark: #0284c7;
  --danger: #fb7185;
  --success: #34d399;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.20), transparent 34%),
    radial-gradient(circle at 92% 16%, rgba(129, 140, 248, 0.22), transparent 34%),
    linear-gradient(135deg, #020617 0%, #0f172a 46%, #111827 100%);
}

button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }

.app-shell {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 28px 0 40px;
}

.topbar {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
}

.eyebrow {
  margin: 0 0 6px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

h1, h2, h3 { margin: 0; }
h1 { font-size: clamp(2.1rem, 5vw, 4.3rem); letter-spacing: -0.06em; line-height: 0.95; }
h2 { font-size: clamp(1.4rem, 2vw, 2rem); letter-spacing: -0.035em; }
h3 { font-size: 1rem; }

.clock-card {
  min-width: 280px;
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 18px 22px;
  background: rgba(15, 23, 42, 0.66);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  text-align: right;
}

.clock {
  font-variant-numeric: tabular-nums;
  font-size: clamp(2rem, 5vw, 3.8rem);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.05em;
}
.today { color: var(--muted); margin-top: 8px; }

.layout {
  display: grid;
  grid-template-columns: minmax(340px, 440px) 1fr;
  gap: 20px;
}

.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  padding: 22px;
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.alarm-form { display: grid; gap: 16px; }

.time-input-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 12px;
}

.colon {
  padding-bottom: 10px;
  font-size: 3rem;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}

.field { display: grid; gap: 8px; }
.field span, .toggle-row span {
  color: #cbd5e1;
  font-size: 0.92rem;
  font-weight: 750;
}

input[type="number"], input[type="text"], input[type="date"] {
  width: 100%;
  border: 1px solid rgba(148, 163, 184, 0.34);
  border-radius: var(--radius-md);
  background: #f8fafc;
  color: #020617;
  padding: 14px 14px;
  outline: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
}

input[type="number"] {
  height: 88px;
  text-align: center;
  font-size: 2.8rem;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

input[type="text"], input[type="date"] { font-size: 1.02rem; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18); }

.quick-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip, .ghost-button, .small-button, .secondary-button, .primary-button {
  border: 0;
  border-radius: 999px;
  transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
}
.chip:hover, .ghost-button:hover, .small-button:hover, .secondary-button:hover, .primary-button:hover { transform: translateY(-1px); }
.chip {
  padding: 10px 8px;
  background: rgba(56, 189, 248, 0.12);
  color: #e0f2fe;
  border: 1px solid rgba(56, 189, 248, 0.22);
  font-weight: 800;
}

.segmented {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(2, 6, 23, 0.42);
}
.segmented label { position: relative; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span {
  display: block;
  padding: 11px 10px;
  border-radius: 999px;
  text-align: center;
  color: var(--muted);
  font-weight: 850;
}
.segmented input:checked + span {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
}

.settings-grid { display: grid; gap: 12px; }
.toggle-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: rgba(2, 6, 23, 0.32);
}
.toggle-row input { width: 18px; height: 18px; accent-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.primary-button {
  width: 100%;
  padding: 15px 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #020617;
  font-weight: 950;
  font-size: 1.05rem;
}
.secondary-button {
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.09);
  color: var(--text);
  border: 1px solid var(--line);
  font-weight: 850;
}
.ghost-button {
  padding: 10px 13px;
  background: rgba(255, 255, 255, 0.08);
  color: #e2e8f0;
  border: 1px solid var(--line);
  font-weight: 850;
  white-space: nowrap;
}
.danger-text { color: #fecdd3; }

.list-panel { min-height: 620px; }
.list-head { align-items: center; }
.head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.status {
  margin-bottom: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(56, 189, 248, 0.18);
  border-radius: var(--radius-md);
  background: rgba(56, 189, 248, 0.08);
  color: #dbeafe;
  font-size: 0.94rem;
}

.alarms-list { display: grid; gap: 12px; }
.alarm-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035));
}
.alarm-card.disabled { opacity: 0.52; }
.alarm-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
.alarm-time {
  min-width: 94px;
  font-size: 2rem;
  line-height: 1;
  letter-spacing: -0.055em;
  font-weight: 950;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.alarm-label { margin-bottom: 4px; overflow-wrap: anywhere; }
.alarm-meta { margin: 0; color: var(--muted); font-size: 0.92rem; }
.alarm-actions { display: flex; gap: 8px; flex-shrink: 0; }
.small-button {
  padding: 10px 13px;
  background: rgba(255, 255, 255, 0.09);
  color: var(--text);
  border: 1px solid var(--line);
  font-weight: 850;
}
.small-button.danger { color: #fecdd3; background: rgba(251, 113, 133, 0.10); }

.empty-state {
  display: none;
  min-height: 300px;
  place-items: center;
  text-align: center;
  color: var(--muted);
  border: 1px dashed rgba(148, 163, 184, 0.28);
  border-radius: var(--radius-xl);
  padding: 40px;
}
.empty-state.visible { display: grid; }
.empty-icon { font-size: 4rem; margin-bottom: 10px; }
.empty-state h3 { color: var(--text); font-size: 1.2rem; margin-bottom: 6px; }
.empty-state p { margin: 0; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(2, 6, 23, 0.76);
  backdrop-filter: blur(14px);
}
.overlay.hidden { display: none; }
.ring-card {
  width: min(560px, 100%);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 34px;
  padding: 34px;
  background: linear-gradient(145deg, #0f172a, #111827 55%, #1e1b4b);
  box-shadow: 0 30px 100px rgba(0,0,0,0.55);
  text-align: center;
}
.ring-card h2 { font-size: 2.2rem; }
.ring-time {
  margin: 18px 0 6px;
  font-size: clamp(4.8rem, 14vw, 7.5rem);
  line-height: 0.9;
  font-weight: 1000;
  letter-spacing: -0.09em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.ring-label { color: #e2e8f0; font-size: 1.2rem; margin-bottom: 26px; }
.ring-actions { display: grid; gap: 10px; }
.stop-button { background: linear-gradient(135deg, #22c55e, #38bdf8); }

@media (max-width: 900px) {
  .topbar { flex-direction: column; }
  .clock-card { text-align: left; min-width: 0; }
  .layout { grid-template-columns: 1fr; }
  .list-panel { min-height: 420px; }
}

@media (max-width: 560px) {
  .app-shell { width: min(100% - 20px, 1180px); padding-top: 16px; }
  .panel { padding: 16px; border-radius: 22px; }
  .panel-head, .list-head { flex-direction: column; align-items: stretch; }
  .head-actions { justify-content: stretch; }
  .head-actions .ghost-button { flex: 1; }
  .quick-row { grid-template-columns: repeat(2, 1fr); }
  .segmented { grid-template-columns: 1fr; border-radius: var(--radius-lg); }
  .alarm-card { align-items: stretch; flex-direction: column; }
  .alarm-actions { display: grid; grid-template-columns: 1fr 1fr; }
  .small-button { width: 100%; }
}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Alarm Dashboard</p>
        <h1>Finns Wecker</h1>
      </div>
      <div class="clock-card" aria-label="Aktuelle Uhrzeit">
        <div id="clock" class="clock">--:--:--</div>
        <div id="today" class="today">--</div>
      </div>
    </header>

    <main class="layout">
      <section class="panel create-panel" aria-labelledby="create-title">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Neuer Alarm</p>
            <h2 id="create-title">Wecker einstellen</h2>
          </div>
          <button id="testSoundBtn" class="ghost-button" type="button">Ton testen</button>
        </div>

        <form id="alarmForm" class="alarm-form">
          <div class="time-input-row">
            <label class="field compact">
              <span>Stunde</span>
              <input id="hourInput" type="number" min="0" max="23" inputmode="numeric" value="07" required />
            </label>
            <div class="colon">:</div>
            <label class="field compact">
              <span>Minute</span>
              <input id="minuteInput" type="number" min="0" max="59" inputmode="numeric" value="30" required />
            </label>
          </div>

          <div class="quick-row" aria-label="Schnellwecker">
            <button class="chip" type="button" data-add-minutes="1">+1 min</button>
            <button class="chip" type="button" data-add-minutes="5">+5 min</button>
            <button class="chip" type="button" data-add-minutes="10">+10 min</button>
            <button class="chip" type="button" data-add-minutes="30">+30 min</button>
          </div>

          <label class="field">
            <span>Beschriftung</span>
            <input id="labelInput" type="text" maxlength="40" placeholder="z. B. Uni, Lauftraining, Aufstehen" />
          </label>

          <div class="segmented" role="radiogroup" aria-label="Alarmtyp">
            <label>
              <input type="radio" name="alarmType" value="once" checked />
              <span>Einmalig</span>
            </label>
            <label>
              <input type="radio" name="alarmType" value="daily" />
              <span>Täglich</span>
            </label>
            <label>
              <input type="radio" name="alarmType" value="weekdays" />
              <span>Mo–Fr</span>
            </label>
          </div>

          <label id="dateField" class="field">
            <span>Datum für einmaligen Alarm</span>
            <input id="dateInput" type="date" required />
          </label>

          <div class="settings-grid">
            <label class="field">
              <span>Lautstärke</span>
              <input id="volumeInput" type="range" min="0.05" max="1" step="0.05" value="0.65" />
            </label>
            <label class="toggle-row">
              <input id="vibrateInput" type="checkbox" checked />
              <span>Vibration nutzen, falls verfügbar</span>
            </label>
          </div>

          <button class="primary-button" type="submit">Alarm hinzufügen</button>
        </form>
      </section>

      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="panel-head list-head">
          <div>
            <p class="eyebrow">Gespeichert</p>
            <h2 id="list-title">Aktive Wecker</h2>
          </div>
          <div class="head-actions">
            <button id="notifyBtn" class="ghost-button" type="button">Benachrichtigungen</button>
            <button id="wakeLockBtn" class="ghost-button" type="button">Wachhalten</button>
            <button id="clearDoneBtn" class="ghost-button danger-text" type="button">Erledigte löschen</button>
          </div>
        </div>

        <div id="status" class="status" role="status">Bereit. Diese Web-App muss geöffnet bleiben, damit Alarme auslösen.</div>
        <div id="alarmsList" class="alarms-list" aria-live="polite"></div>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">⏰</div>
          <h3>Noch keine Alarme</h3>
          <p>Stelle links einen Wecker ein oder nutze einen Schnellwecker.</p>
        </div>
      </section>
    </main>
  </div>

  <div id="alarmOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ringTitle">
    <div class="ring-card">
      <p class="eyebrow">Alarm</p>
      <h2 id="ringTitle">Zeit ist um</h2>
      <div id="ringTime" class="ring-time">--:--</div>
      <div id="ringLabel" class="ring-label">Alarm</div>
      <div class="ring-actions">
        <button id="stopBtn" class="primary-button stop-button" type="button">Stoppen</button>
        <button id="snooze5Btn" class="secondary-button" type="button">Snooze 5 min</button>
        <button id="snooze10Btn" class="secondary-button" type="button">Snooze 10 min</button>
      </div>
    </div>
  </div>

  <template id="alarmTemplate">
    <article class="alarm-card">
      <div class="alarm-main">
        <div class="alarm-time">07:30</div>
        <div>
          <h3 class="alarm-label">Alarm</h3>
          <p class="alarm-meta">Einmalig · Heute</p>
        </div>
      </div>
      <div class="alarm-actions">
        <button class="small-button toggle-btn" type="button">Deaktivieren</button>
        <button class="small-button delete-btn danger" type="button">Löschen</button>
      </div>
    </article>
  </template>

<script>
'use strict';

const STORAGE_KEY = 'finns-wecker.alarms.v1';
const PREF_KEY = 'finns-wecker.preferences.v1';
const CHECK_INTERVAL_MS = 500;

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => Array.from(document.querySelectorAll(selector));

const state = {
  alarms: [],
  activeAlarm: null,
  audio: null,
  wakeLock: null,
};

const elements = {
  clock: $('#clock'),
  today: $('#today'),
  form: $('#alarmForm'),
  hourInput: $('#hourInput'),
  minuteInput: $('#minuteInput'),
  dateInput: $('#dateInput'),
  dateField: $('#dateField'),
  labelInput: $('#labelInput'),
  volumeInput: $('#volumeInput'),
  vibrateInput: $('#vibrateInput'),
  list: $('#alarmsList'),
  empty: $('#emptyState'),
  status: $('#status'),
  template: $('#alarmTemplate'),
  overlay: $('#alarmOverlay'),
  ringTime: $('#ringTime'),
  ringLabel: $('#ringLabel'),
  stopBtn: $('#stopBtn'),
  snooze5Btn: $('#snooze5Btn'),
  snooze10Btn: $('#snooze10Btn'),
  notifyBtn: $('#notifyBtn'),
  wakeLockBtn: $('#wakeLockBtn'),
  clearDoneBtn: $('#clearDoneBtn'),
  testSoundBtn: $('#testSoundBtn'),
};

function pad2(value) {
  return String(value).padStart(2, '0');
}

function toDateInputValue(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function parseLocalDateTime(dateText, hour, minute) {
  const [year, month, day] = dateText.split('-').map(Number);
  return new Date(year, month - 1, day, hour, minute, 0, 0);
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return `alarm-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function normalizeHourMinute() {
  let hour = Number(elements.hourInput.value);
  let minute = Number(elements.minuteInput.value);
  if (!Number.isFinite(hour)) hour = 0;
  if (!Number.isFinite(minute)) minute = 0;
  hour = Math.max(0, Math.min(23, Math.trunc(hour)));
  minute = Math.max(0, Math.min(59, Math.trunc(minute)));
  elements.hourInput.value = pad2(hour);
  elements.minuteInput.value = pad2(minute);
  return { hour, minute };
}

function selectedType() {
  const selected = document.querySelector('input[name="alarmType"]:checked');
  return selected ? selected.value : 'once';
}

function loadAlarms() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state.alarms = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(state.alarms)) state.alarms = [];
  } catch (_error) {
    state.alarms = [];
    setStatus('Gespeicherte Alarme konnten nicht gelesen werden. Speicher wurde neu gestartet.');
  }
}

function saveAlarms() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.alarms));
}

function loadPreferences() {
  try {
    const prefs = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
    if (typeof prefs.volume === 'number') elements.volumeInput.value = String(prefs.volume);
    if (typeof prefs.vibrate === 'boolean') elements.vibrateInput.checked = prefs.vibrate;
  } catch (_error) {
    // Ignore invalid preferences.
  }
}

function savePreferences() {
  localStorage.setItem(PREF_KEY, JSON.stringify({
    volume: Number(elements.volumeInput.value),
    vibrate: elements.vibrateInput.checked,
  }));
}

function setStatus(message) {
  elements.status.textContent = message;
}

function getWeekdayMondayFirst(date) {
  const jsDay = date.getDay();
  return jsDay === 0 ? 7 : jsDay;
}

function nextTriggerForAlarm(alarm, now = new Date()) {
  if (!alarm.enabled) return null;

  if (alarm.type === 'once') {
    if (!alarm.triggerAt) return null;
    const trigger = new Date(alarm.triggerAt);
    return Number.isNaN(trigger.getTime()) ? null : trigger;
  }

  for (let offset = 0; offset <= 8; offset += 1) {
    const candidate = new Date(now);
    candidate.setDate(candidate.getDate() + offset);
    candidate.setHours(alarm.hour, alarm.minute, 0, 0);

    if (candidate <= now) continue;

    if (alarm.type === 'daily') return candidate;
    if (alarm.type === 'weekdays') {
      const day = getWeekdayMondayFirst(candidate);
      if (day >= 1 && day <= 5) return candidate;
    }
  }

  return null;
}

function formatAlarmTime(alarm) {
  return `${pad2(alarm.hour)}:${pad2(alarm.minute)}`;
}

function formatDateLong(date) {
  return new Intl.DateTimeFormat('de-DE', {
    weekday: 'long',
    day: '2-digit',
    month: 'long',
    year: 'numeric',
  }).format(date);
}

function formatNextTrigger(trigger) {
  if (!trigger) return 'Keine nächste Auslösung';
  const now = new Date();
  const today = toDateInputValue(now);
  const tomorrowDate = new Date(now);
  tomorrowDate.setDate(tomorrowDate.getDate() + 1);
  const tomorrow = toDateInputValue(tomorrowDate);
  const triggerDay = toDateInputValue(trigger);
  const time = `${pad2(trigger.getHours())}:${pad2(trigger.getMinutes())}`;

  if (triggerDay === today) return `Heute um ${time}`;
  if (triggerDay === tomorrow) return `Morgen um ${time}`;
  return `${new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }).format(trigger)} um ${time}`;
}

function typeLabel(type) {
  if (type === 'daily') return 'Täglich';
  if (type === 'weekdays') return 'Mo–Fr';
  return 'Einmalig';
}

function renderAlarms() {
  const now = new Date();
  state.alarms.sort((a, b) => {
    const nextA = nextTriggerForAlarm(a, now);
    const nextB = nextTriggerForAlarm(b, now);
    const timeA = nextA ? nextA.getTime() : Number.MAX_SAFE_INTEGER;
    const timeB = nextB ? nextB.getTime() : Number.MAX_SAFE_INTEGER;
    return timeA - timeB;
  });

  elements.list.innerHTML = '';
  elements.empty.classList.toggle('visible', state.alarms.length === 0);

  state.alarms.forEach((alarm) => {
    const fragment = elements.template.content.cloneNode(true);
    const card = fragment.querySelector('.alarm-card');
    const time = fragment.querySelector('.alarm-time');
    const label = fragment.querySelector('.alarm-label');
    const meta = fragment.querySelector('.alarm-meta');
    const toggle = fragment.querySelector('.toggle-btn');
    const del = fragment.querySelector('.delete-btn');

    const next = nextTriggerForAlarm(alarm, now);
    time.textContent = formatAlarmTime(alarm);
    label.textContent = alarm.label || 'Alarm';
    meta.textContent = `${typeLabel(alarm.type)} · ${alarm.enabled ? formatNextTrigger(next) : 'Deaktiviert'}`;
    toggle.textContent = alarm.enabled ? 'Deaktivieren' : 'Aktivieren';
    card.classList.toggle('disabled', !alarm.enabled);

    toggle.addEventListener('click', () => toggleAlarm(alarm.id));
    del.addEventListener('click', () => deleteAlarm(alarm.id));

    elements.list.appendChild(fragment);
  });
}

function createAlarmFromForm(event) {
  event.preventDefault();
  const { hour, minute } = normalizeHourMinute();
  const type = selectedType();
  const label = elements.labelInput.value.trim() || 'Alarm';
  const now = new Date();

  let triggerAt = null;
  if (type === 'once') {
    let dateText = elements.dateInput.value || toDateInputValue(now);
    let trigger = parseLocalDateTime(dateText, hour, minute);

    if (trigger <= now) {
      trigger = new Date(now);
      trigger.setDate(trigger.getDate() + 1);
      trigger.setHours(hour, minute, 0, 0);
      dateText = toDateInputValue(trigger);
      elements.dateInput.value = dateText;
    }
    triggerAt = trigger.toISOString();
  }

  const alarm = {
    id: uuid(),
    label,
    hour,
    minute,
    type,
    enabled: true,
    triggerAt,
    lastTriggeredKey: null,
    createdAt: new Date().toISOString(),
    temporary: false,
  };

  state.alarms.push(alarm);
  saveAlarms();
  renderAlarms();
  setStatus(`Alarm „${label}“ wurde für ${formatNextTrigger(nextTriggerForAlarm(alarm))} gespeichert.`);
}

function toggleAlarm(id) {
  const alarm = state.alarms.find((item) => item.id === id);
  if (!alarm) return;

  alarm.enabled = !alarm.enabled;
  alarm.lastTriggeredKey = null;

  if (alarm.enabled && alarm.type === 'once') {
    const now = new Date();
    let trigger = alarm.triggerAt ? new Date(alarm.triggerAt) : null;
    if (!trigger || Number.isNaN(trigger.getTime()) || trigger <= now) {
      trigger = new Date(now);
      trigger.setHours(alarm.hour, alarm.minute, 0, 0);
      if (trigger <= now) trigger.setDate(trigger.getDate() + 1);
      alarm.triggerAt = trigger.toISOString();
    }
  }

  saveAlarms();
  renderAlarms();
  setStatus(`Alarm „${alarm.label}“ wurde ${alarm.enabled ? 'aktiviert' : 'deaktiviert'}.`);
}

function deleteAlarm(id) {
  const alarm = state.alarms.find((item) => item.id === id);
  if (!alarm) return;
  state.alarms = state.alarms.filter((item) => item.id !== id);
  saveAlarms();
  renderAlarms();
  setStatus(`Alarm „${alarm.label}“ wurde gelöscht.`);
}

function clearDoneAlarms() {
  const before = state.alarms.length;
  state.alarms = state.alarms.filter((alarm) => {
    if (alarm.type !== 'once') return true;
    if (alarm.enabled) return true;
    return false;
  });
  saveAlarms();
  renderAlarms();
  setStatus(`${before - state.alarms.length} erledigte einmalige Alarme gelöscht.`);
}

function addQuickAlarm(minutes) {
  const trigger = new Date(Date.now() + minutes * 60 * 1000);
  elements.hourInput.value = pad2(trigger.getHours());
  elements.minuteInput.value = pad2(trigger.getMinutes());
  elements.dateInput.value = toDateInputValue(trigger);
  document.querySelector('input[name="alarmType"][value="once"]').checked = true;
  updateDateVisibility();
  elements.labelInput.value = `Timer ${minutes} min`;
  setStatus(`Schnellwecker auf ${pad2(trigger.getHours())}:${pad2(trigger.getMinutes())} gesetzt. Zum Speichern „Alarm hinzufügen“ klicken.`);
}

function triggerKey(alarm, trigger) {
  if (alarm.type === 'once') return alarm.id;
  return `${alarm.id}-${toDateInputValue(trigger)}-${pad2(trigger.getHours())}${pad2(trigger.getMinutes())}`;
}

function checkAlarms() {
  if (state.activeAlarm) return;

  const now = new Date();
  const due = state.alarms.find((alarm) => {
    if (!alarm.enabled) return false;
    const trigger = nextTriggerForAlarm(alarm, now);
    if (!trigger) return false;
    const key = triggerKey(alarm, trigger);
    if (alarm.lastTriggeredKey === key) return false;
    return trigger.getTime() <= now.getTime() + CHECK_INTERVAL_MS;
  });

  if (due) startRinging(due);
}

function ensureAudioContext() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;
  if (!state.audio) {
    const context = new AudioContextClass();
    const gain = context.createGain();
    gain.gain.value = 0;
    gain.connect(context.destination);
    state.audio = {
      context,
      gain,
      oscillators: [],
      interval: null,
    };
  }
  return state.audio;
}

async function startSound() {
  const audio = ensureAudioContext();
  if (!audio) {
    setStatus('Dieser Browser unterstützt Web-Audio nicht.');
    return;
  }

  if (audio.context.state === 'suspended') {
    await audio.context.resume();
  }

  stopSound();

  const volume = Number(elements.volumeInput.value) || 0.65;
  const osc1 = audio.context.createOscillator();
  const osc2 = audio.context.createOscillator();
  osc1.type = 'sine';
  osc2.type = 'triangle';
  osc1.frequency.value = 880;
  osc2.frequency.value = 1320;
  osc1.connect(audio.gain);
  osc2.connect(audio.gain);
  osc1.start();
  osc2.start();
  audio.oscillators = [osc1, osc2];

  let on = false;
  audio.interval = window.setInterval(() => {
    on = !on;
    const now = audio.context.currentTime;
    audio.gain.gain.cancelScheduledValues(now);
    audio.gain.gain.setTargetAtTime(on ? volume : 0.001, now, 0.015);
  }, 420);
}

function stopSound() {
  if (!state.audio) return;
  if (state.audio.interval) {
    window.clearInterval(state.audio.interval);
    state.audio.interval = null;
  }
  state.audio.gain.gain.value = 0;
  state.audio.oscillators.forEach((osc) => {
    try { osc.stop(); } catch (_error) { /* already stopped */ }
    try { osc.disconnect(); } catch (_error) { /* already disconnected */ }
  });
  state.audio.oscillators = [];
}

function notify(alarm) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification('Finns Wecker', {
      body: `${formatAlarmTime(alarm)} · ${alarm.label || 'Alarm'}`,
      tag: alarm.id,
      requireInteraction: true,
    });
  } catch (_error) {
    // Some browsers block notifications in local file contexts.
  }
}

async function startRinging(alarm) {
  const trigger = nextTriggerForAlarm(alarm) || new Date();
  alarm.lastTriggeredKey = triggerKey(alarm, trigger);
  if (alarm.type === 'once') alarm.enabled = false;
  saveAlarms();
  renderAlarms();

  state.activeAlarm = alarm;
  elements.ringTime.textContent = formatAlarmTime(alarm);
  elements.ringLabel.textContent = alarm.label || 'Alarm';
  elements.overlay.classList.remove('hidden');
  elements.stopBtn.focus();
  setStatus(`Alarm „${alarm.label}“ läuft.`);

  if (elements.vibrateInput.checked && navigator.vibrate) {
    navigator.vibrate([300, 120, 300, 120, 600]);
  }
  notify(alarm);
  await startSound();
}

function stopRinging() {
  stopSound();
  if (navigator.vibrate) navigator.vibrate(0);
  elements.overlay.classList.add('hidden');
  const label = state.activeAlarm ? state.activeAlarm.label : 'Alarm';
  state.activeAlarm = null;
  setStatus(`Alarm „${label}“ gestoppt.`);
}

function snooze(minutes) {
  const original = state.activeAlarm;
  stopRinging();
  if (!original) return;

  const trigger = new Date(Date.now() + minutes * 60 * 1000);
  const alarm = {
    id: uuid(),
    label: `Snooze: ${original.label || 'Alarm'}`,
    hour: trigger.getHours(),
    minute: trigger.getMinutes(),
    type: 'once',
    enabled: true,
    triggerAt: trigger.toISOString(),
    lastTriggeredKey: null,
    createdAt: new Date().toISOString(),
    temporary: true,
  };
  state.alarms.push(alarm);
  saveAlarms();
  renderAlarms();
  setStatus(`Snooze für ${minutes} Minuten erstellt.`);
}

async function requestNotifications() {
  if (!('Notification' in window)) {
    setStatus('Dieser Browser unterstützt keine Benachrichtigungen.');
    return;
  }
  const permission = await Notification.requestPermission();
  setStatus(permission === 'granted'
    ? 'Benachrichtigungen sind aktiviert.'
    : 'Benachrichtigungen sind nicht aktiviert. Der Alarm funktioniert trotzdem im geöffneten Tab.');
}

async function toggleWakeLock() {
  if (!('wakeLock' in navigator)) {
    setStatus('Wake Lock wird von diesem Browser nicht unterstützt.');
    return;
  }

  try {
    if (state.wakeLock) {
      await state.wakeLock.release();
      state.wakeLock = null;
      elements.wakeLockBtn.textContent = 'Wachhalten';
      setStatus('Wachhalten deaktiviert.');
      return;
    }

    state.wakeLock = await navigator.wakeLock.request('screen');
    state.wakeLock.addEventListener('release', () => {
      state.wakeLock = null;
      elements.wakeLockBtn.textContent = 'Wachhalten';
    });
    elements.wakeLockBtn.textContent = 'Wachhalten aktiv';
    setStatus('Bildschirm-Wachhalten aktiviert, solange der Tab offen bleibt.');
  } catch (error) {
    setStatus(`Wake Lock konnte nicht aktiviert werden: ${error.message}`);
  }
}

function updateClock() {
  const now = new Date();
  elements.clock.textContent = new Intl.DateTimeFormat('de-DE', {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
  }).format(now);
  elements.today.textContent = formatDateLong(now);
}

function updateDateVisibility() {
  const isOnce = selectedType() === 'once';
  elements.dateField.style.display = isOnce ? 'grid' : 'none';
  elements.dateInput.required = isOnce;
}

function setDefaultFormValues() {
  const now = new Date();
  const defaultAlarm = new Date(now.getTime() + 10 * 60 * 1000);
  elements.hourInput.value = pad2(defaultAlarm.getHours());
  elements.minuteInput.value = pad2(defaultAlarm.getMinutes());
  elements.dateInput.value = toDateInputValue(defaultAlarm);
}

function bindEvents() {
  elements.form.addEventListener('submit', createAlarmFromForm);
  elements.hourInput.addEventListener('blur', normalizeHourMinute);
  elements.minuteInput.addEventListener('blur', normalizeHourMinute);
  elements.volumeInput.addEventListener('input', savePreferences);
  elements.vibrateInput.addEventListener('change', savePreferences);

  $$('[data-add-minutes]').forEach((button) => {
    button.addEventListener('click', () => addQuickAlarm(Number(button.dataset.addMinutes)));
  });

  $$('input[name="alarmType"]').forEach((input) => {
    input.addEventListener('change', updateDateVisibility);
  });

  elements.stopBtn.addEventListener('click', stopRinging);
  elements.snooze5Btn.addEventListener('click', () => snooze(5));
  elements.snooze10Btn.addEventListener('click', () => snooze(10));
  elements.notifyBtn.addEventListener('click', requestNotifications);
  elements.wakeLockBtn.addEventListener('click', toggleWakeLock);
  elements.clearDoneBtn.addEventListener('click', clearDoneAlarms);
  elements.testSoundBtn.addEventListener('click', async () => {
    setStatus('Testton läuft für zwei Sekunden.');
    await startSound();
    window.setTimeout(() => {
      stopSound();
      setStatus('Testton beendet.');
    }, 2000);
  });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && state.wakeLock) {
      try { state.wakeLock = await navigator.wakeLock.request('screen'); } catch (_error) { /* ignore */ }
    }
  });

  window.addEventListener('beforeunload', () => {
    stopSound();
    if (state.wakeLock) state.wakeLock.release();
  });
}

function boot() {
  setDefaultFormValues();
  loadPreferences();
  loadAlarms();
  updateDateVisibility();
  bindEvents();
  updateClock();
  renderAlarms();
  window.setInterval(updateClock, 250);
  window.setInterval(checkAlarms, CHECK_INTERVAL_MS);
}

boot();

</script>
</body>
</html>
